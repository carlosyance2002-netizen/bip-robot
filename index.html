<!DOCTYPE html>
<html lang="es" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bip Robot - Compañero IA Interactivo</title>
    <meta name="description" content="Compañero virtual interactivo con interfaz futurista, animaciones 3D, síntesis y reconocimiento de voz con IA.">
    
    <!-- Google Fonts: Space Grotesk (Titulares/UI) e Inter (Lectura/Chat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <!-- Contenedor Principal Adaptable (2 columnas en escritorio, 1 en móvil) -->
    <div class="app-layout">

        <!-- Panel Izquierdo: Robot, Estado y Personalización -->
        <aside class="panel-robot">
            
            <!-- Barra Superior de Estado con Menú Circular de Colores -->
            <header class="top-bar">
                <div class="status-badge">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Conectando...</span>
                </div>
                <div class="top-actions">
                    <!-- Menú Circular Expandible de Temas de Color -->
                    <div class="palette-dial-wrapper" id="palette-dial-wrapper">
                        <button class="icon-btn palette-fab" id="palette-fab" title="Personalizar color" aria-label="Cambiar tema de color" aria-expanded="false">
                            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
                                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
                                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
                                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
                                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
                            </svg>
                            <span class="active-color-dot" id="active-color-dot"></span>
                        </button>
                        <div class="palette-popup" id="palette-popup" role="menu" aria-label="Opciones de tema">
                            <button class="palette-item active" data-theme="dracula" role="menuitem" title="Tema Dracula">
                                <span class="palette-swatch dracula"></span>
                                <span class="palette-name">Dracula</span>
                            </button>
                            <button class="palette-item" data-theme="cyberpunk" role="menuitem" title="Tema Cyberpunk">
                                <span class="palette-swatch cyberpunk"></span>
                                <span class="palette-name">Cyber</span>
                            </button>
                            <button class="palette-item" data-theme="matrix" role="menuitem" title="Tema Matrix">
                                <span class="palette-swatch matrix"></span>
                                <span class="palette-name">Matrix</span>
                            </button>
                            <button class="palette-item" data-theme="solar" role="menuitem" title="Tema Solar">
                                <span class="palette-swatch solar"></span>
                                <span class="palette-name">Solar</span>
                            </button>
                        </div>
                    </div>

                    <button class="icon-btn" id="sfx-toggle" title="Alternar audio" aria-label="Alternar efectos de sonido">
                        <svg class="svg-icon" id="sfx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        </svg>
                        <span>Audio</span>
                    </button>
                    <button class="icon-btn" id="btn-limpiar" title="Reiniciar chat" aria-label="Limpiar conversación">
                        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Robot Bip 3D Interactivo con Silueta Original -->
            <div class="robot-container">
                <div class="robot robot-flotando" id="robot" role="button" tabindex="0" aria-label="Robot Bip interactivo">
                    <div class="antena-punta"></div>
                    <div class="antena"></div>
                    <div class="cabeza" id="cabeza">
                        <div class="ojo-container izq">
                            <div class="ojo-pupila">
                                <span class="ojo-reflejo"></span>
                            </div>
                        </div>
                        <div class="ojo-container der">
                            <div class="ojo-pupila">
                                <span class="ojo-reflejo"></span>
                            </div>
                        </div>
                        <div class="boca"></div>
                    </div>
                    <div class="cuerpo-wrapper">
                        <div class="brazo brazo-izq"></div>
                        <div class="cuerpo">
                            <!-- Corazón Robótico Moderno Interactivo -->
                            <div class="corazon-robotico" id="corazon" role="button" tabindex="0" aria-label="Corazón cibernético de Bip" title="Tocar el corazón de Bip">
                                <svg class="cyber-heart-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <!-- Chasis mecha exterior -->
                                    <path class="heart-frame" d="M24 11 C20 6 12 5 7.5 10 C3 15 3 22.5 8 28.5 L24 42 L40 28.5 C45 22.5 45 15 40.5 10 C36 5 28 6 24 11 Z"></path>
                                    <!-- Cámaras y placas facetadas mecha -->
                                    <path class="heart-facet-left" d="M24 15 L14 15 L10 20 L13 26 L24 35 Z"></path>
                                    <path class="heart-facet-right" d="M24 15 L34 15 L38 20 L35 26 L24 35 Z"></path>
                                    <!-- Micro-ranura divisoria y circuitos cibernéticos -->
                                    <line class="heart-seam" x1="24" y1="12" x2="24" y2="38"></line>
                                    <path class="heart-circuit" d="M14 18 L19 23 L24 23"></path>
                                    <path class="heart-circuit" d="M34 18 L29 23 L24 23"></path>
                                    <!-- Núcleo cibernético central pulsante -->
                                    <circle class="heart-core-glow" cx="24" cy="23" r="4.8"></circle>
                                    <circle class="heart-core-center" cx="24" cy="23" r="2.2"></circle>
                                </svg>
                            </div>
                        </div>
                        <div class="brazo brazo-der"></div>
                    </div>
                    <div class="piernas-wrapper">
                        <div class="pierna pierna-izq"></div>
                        <div class="pierna pierna-der"></div>
                    </div>
                </div>
                <!-- Sombra de suelo reactiva a la levitación -->
                <div class="sombra-suelo" id="sombra-suelo"></div>
            </div>

            <p class="instruccion">Mueve el cursor, toca su corazón o habla por el micrófono</p>
        </aside>

        <!-- Panel Derecho: Conversación y Chat -->
        <main class="panel-chat">

            <!-- Chips de Sugerencias Rápidas Vectoriales -->
            <section class="sugerencias-chips" aria-label="Sugerencias rápidas">
                <button class="chip-btn" data-prompt="¡Hola Bip! ¿Qué puedes hacer hoy?">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Presentación
                </button>
                <button class="chip-btn" data-prompt="Juguemos piedra, papel o tijera">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="3"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><circle cx="17" cy="10" r="1"></circle><circle cx="15" cy="13" r="1"></circle></svg>
                    Piedra, papel o tijera
                </button>
                <button class="chip-btn" data-prompt="¡Baila para mí!">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    ¡Baila!
                </button>
                <button class="chip-btn" data-prompt="Cuéntame un chiste robótico">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    Chiste
                </button>
                <button class="chip-btn" data-prompt="¿Qué hora es?">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    ¿Qué hora es?
                </button>
            </section>

            <!-- Contenedor del Chat Glassmorphism -->
            <section class="chat-container">
                <div class="chat-box" id="chat-box" role="log" aria-live="polite"></div>
                <div class="input-area">
                    <input type="text" id="user-input" placeholder="Escribe un mensaje (o pulsa Ctrl+K)..." autocomplete="off" aria-label="Mensaje para Bip">
                    <button class="accion-btn mic-btn" id="mic-btn" title="Hablar por micrófono" aria-label="Activar micrófono">
                        <svg class="svg-icon" id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button class="accion-btn send-btn" id="btn-enviar" aria-label="Enviar mensaje">
                        <span>Enviar</span>
                        <svg class="svg-icon send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </section>

        </main>

    </div>

</body>
</html>
