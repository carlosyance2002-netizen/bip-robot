<!DOCTYPE html>
<html lang="es" data-theme="cobalt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bip Robot - Asistente Mecánico IA</title>
    <meta name="description" content="Compañero virtual robótico con anatomía articulada, cinemática expresiva, síntesis y reconocimiento de voz con IA.">
    
    <!-- Google Fonts: Space Grotesk e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <!-- Contenedor Principal Adaptable (2 columnas en PC, 1 en móvil) -->
    <div class="app-layout">

        <!-- Panel Izquierdo: Robot Articulado, Estado y Temas Sólidos -->
        <aside class="panel-robot">
            
            <!-- Barra de Estado Mate -->
            <header class="top-bar">
                <div class="status-badge">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Conectando...</span>
                </div>
                <div class="top-actions">
                    <button class="icon-btn" id="sfx-toggle" title="Alternar audio" aria-label="Alternar efectos de sonido">
                        <svg class="svg-icon" id="sfx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        </svg>
                        <span>Audio</span>
                    </button>
                    <button class="icon-btn" id="btn-limpiar" title="Reiniciar chat" aria-label="Limpiar conversación">
                        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Selector de Skins Sólidos -->
            <nav class="theme-selector" aria-label="Esquemas de color sólidos">
                <span class="theme-label">Skin</span>
                <button class="theme-btn active" data-theme="cobalt" title="Cobalto y Titanio"><span class="theme-dot cobalt"></span>Cobalto</button>
                <button class="theme-btn" data-theme="amber" title="Acero y Ámbar"><span class="theme-dot amber"></span>Ámbar</button>
                <button class="theme-btn" data-theme="forest" title="Oliva y Esmeralda"><span class="theme-dot forest"></span>Bosque</button>
                <button class="theme-btn" data-theme="monochrome" title="Monocromo Minimal"><span class="theme-dot monochrome"></span>Minimal</button>
            </nav>

            <!-- Robot Bip con Anatomía Articulada -->
            <div class="robot-container">
                <div class="robot robot-idle" id="robot" role="button" tabindex="0" aria-label="Robot Bip articulado">
                    
                    <!-- Antena Superior Minimalista -->
                    <div class="antena-sistema">
                        <div class="antena-punta"></div>
                        <div class="antena-mastil"></div>
                    </div>

                    <!-- Cabeza con Pernos, Cejas, Visor y Boca Segmentada -->
                    <div class="cabeza-wrapper">
                        <div class="perno-cabeza perno-izq"></div>
                        <div class="cabeza" id="cabeza">
                            <div class="visor-frontal">
                                <!-- Cejas Robóticas Expresivas -->
                                <div class="cejas-wrapper">
                                    <div class="ceja ceja-izq"></div>
                                    <div class="ceja ceja-der"></div>
                                </div>
                                <!-- Ojos y Pupilas -->
                                <div class="ojos-wrapper">
                                    <div class="ojo-container izq"><div class="ojo-pupila"></div></div>
                                    <div class="ojo-container der"><div class="ojo-pupila"></div></div>
                                </div>
                                <!-- Boca Modular Segmentada -->
                                <div class="boca-modular">
                                    <span class="boca-seg seg-1"></span>
                                    <span class="boca-seg seg-2"></span>
                                    <span class="boca-seg seg-3"></span>
                                </div>
                            </div>
                        </div>
                        <div class="perno-cabeza perno-der"></div>
                    </div>

                    <!-- Cuello Articulado -->
                    <div class="cuello-articulado">
                        <span class="anillo-cuello"></span>
                        <span class="anillo-cuello"></span>
                    </div>

                    <!-- Torso con Hombros, Blindaje y Reactor Sólido -->
                    <div class="torso-ensamblaje">
                        
                        <!-- Brazo Izquierdo Articulado (Hombro + Bíceps + Codo + Antebrazo + Pinza) -->
                        <div class="brazo-articulado brazo-izq">
                            <div class="hombro"></div>
                            <div class="brazo-segmento superior"></div>
                            <div class="codo-pivote"></div>
                            <div class="brazo-segmento inferior"></div>
                            <div class="mano-pinza">
                                <span class="diente-pinza izq"></span>
                                <span class="diente-pinza der"></span>
                            </div>
                        </div>

                        <!-- Torso Central con Placas y Núcleo de Energía Sólido -->
                        <div class="torso">
                            <div class="placa-pecho">
                                <div class="tornillo t-sup-izq"></div>
                                <div class="tornillo t-sup-der"></div>
                                <!-- Núcleo de Estado Mecánico -->
                                <div class="nucleo-mecanico" id="reactor" role="button" tabindex="0" aria-label="Núcleo de energía de Bip" title="Pulsar núcleo central">
                                    <div class="bisel-nucleo">
                                        <div class="disco-rotatorio"></div>
                                        <div class="centro-estado"></div>
                                    </div>
                                </div>
                                <div class="tornillo t-inf-izq"></div>
                                <div class="tornillo t-inf-der"></div>
                            </div>
                        </div>

                        <!-- Brazo Derecho Articulado -->
                        <div class="brazo-articulado brazo-der">
                            <div class="hombro"></div>
                            <div class="brazo-segmento superior"></div>
                            <div class="codo-pivote"></div>
                            <div class="brazo-segmento inferior"></div>
                            <div class="mano-pinza">
                                <span class="diente-pinza izq"></span>
                                <span class="diente-pinza der"></span>
                            </div>
                        </div>

                    </div>

                    <!-- Cintura Pélvica y Piernas Articuladas con Pies -->
                    <div class="tren-inferior">
                        <div class="cintura-pelve"></div>
                        <div class="piernas-wrapper">
                            <!-- Pierna Izquierda -->
                            <div class="pierna-articulada pierna-izq">
                                <div class="muslo"></div>
                                <div class="rodilla"></div>
                                <div class="pantorrilla"></div>
                                <div class="pie-suela"></div>
                            </div>
                            <!-- Pierna Derecha -->
                            <div class="pierna-articulada pierna-der">
                                <div class="muslo"></div>
                                <div class="rodilla"></div>
                                <div class="pantorrilla"></div>
                                <div class="pie-suela"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <p class="instruccion">Mueve el cursor para orientar a Bip, toca su núcleo central o interactúa por voz</p>
        </aside>

        <!-- Panel Derecho: Conversación y Chat con Colores Sólidos -->
        <main class="panel-chat">

            <!-- Chips de Sugerencias Rápidas -->
            <section class="sugerencias-chips" aria-label="Sugerencias rápidas">
                <button class="chip-btn" data-prompt="¡Hola Bip! Preséntate">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    Presentación
                </button>
                <button class="chip-btn" data-prompt="Juguemos piedra, papel o tijera">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="3"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><circle cx="17" cy="10" r="1"></circle><circle cx="15" cy="13" r="1"></circle></svg>
                    Piedra, papel o tijera
                </button>
                <button class="chip-btn" data-prompt="¡Baila para mí!">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    ¡Baila!
                </button>
                <button class="chip-btn" data-prompt="Cuéntame un chiste robótico">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    Chiste
                </button>
                <button class="chip-btn" data-prompt="¿Qué hora es?">
                    <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    ¿Qué hora es?
                </button>
            </section>

            <!-- Contenedor del Chat en Colores Sólidos Mate -->
            <section class="chat-container">
                <div class="chat-box" id="chat-box" role="log" aria-live="polite"></div>
                <div class="input-area">
                    <input type="text" id="user-input" placeholder="Escribe un mensaje (o pulsa Ctrl+K)..." autocomplete="off" aria-label="Mensaje para Bip">
                    <button class="accion-btn mic-btn" id="mic-btn" title="Hablar por micrófono" aria-label="Activar micrófono">
                        <svg class="svg-icon" id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button class="accion-btn send-btn" id="btn-enviar" aria-label="Enviar mensaje">
                        <span>Enviar</span>
                        <svg class="svg-icon send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </section>

        </main>

    </div>

</body>
</html>
